<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registro Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Registro Digital</h1>
      <p>Crea notas con título, descripción e imágenes.</p>
    </header>

    <section class="input-section">
      <input type="text" id="note-title" placeholder="Título de la nota">
      <textarea id="note-text" placeholder="Escribe los detalles aquí..." rows="3"></textarea>
      
      <div class="file-upload-wrapper">
        <label for="note-image" class="file-label">📷 Adjuntar Imagen</label>
        <input type="file" id="note-image" accept="image/*" style="display: none;">
        <span id="file-name">Ningún archivo seleccionado</span>
      </div>

      <button id="btn-save">Registrar Nota</button>
    </section>

    <section class="notes-section">
      <h2>Historial de Notas</h2>
      <div id="notes-list">
        <!-- Las notas se inyectan aquí -->
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
